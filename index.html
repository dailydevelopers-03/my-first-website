<!DOCTYPE html>
<html>
  <head>
    <title>Roshan's First Website</title>
    <link href="css/styles.css" rel="stylesheet">
  </head>

  <body>

    <div class="topbar">

      <div class="menu"
		onclick="openMenuDrawer()">
		
        ☰
      </div>
	  
	  <h1 class="headerTitle">
		SkyWon <span class="xLogo">X</span>
	  </h1>
	  
	 
	 <!--search top icon container--> 
	<div class="searchBtn"
	  onclick="openMiddleTopBar()">
	  
	 <img src="images/search.png"
	  class="topSearchIcon">
	</div>
		
	  
	  <!--mic btn container at the top--> 

	  <img src="images/notification.png"
		class="topMicIcon">

	 
	  <img src="images/profile.png"
		class="userDp">
		
    </div>
	
 <!--Middle Top Bar with searchBar inside it-->
   <div class="middleTopBar"
	 id="middleBar">
	 
	 <div class="searchBarContainer"
	   id="searchBox">

	  <img src="images/icon_search.webp"
		class="searchIcon">

	   <input 
		 type="text" 
		 placeholder="Search Your Favorite..." 
		 class="searchbar">

	 </div>

   </div>
	 
	 
	
	<!--menu drawer list features-->
	  <div class="drawer" id="menuDrawer">

	  <div class="drawerHeader">

		<div class="logoBox">
		  SX
		</div>

		<div class="logoTexts">
		  <h1 class="drawerTitle">SkyWon X</h1>
		  <p class="drawerSubtitle">Creative Studio</p>
		</div>

	  </div>


	  <div class="drawableSearchBarContainer"
		id="searchDrawerBox">
		

		<img src="images/icon_search.webp"
		  class="searchIcon2">
		

		<input 
		  type="text"
		  placeholder="Search..."
		  class="searchDrawerBar">

	  </div>

	  <h2 class="menuTitle">Menu</h2>


	  <div class="settingsPanel">

		<div class="menuItem activeMenu">
		  Home
		</div>

		<div class="menuItem">
		  Activity
		</div>

		<div class="menuItem">
		  Tasks
		</div>

		<div class="menuItem">
		  Users
		</div>

		<div class="menuItem">
		  Notification
		</div>

		<div class="menuItem">
		  Settings
		</div>

	  </div>

	</div>
	
	
	<div class="overlay"
	  id="overlay"
	  onclick="closeMenuDrawer()">

	</div>
	
	

    <div class="section1">

      <h1 class="title">Hello Roshan 🚀</h1>

      <p class="description">
        Welcome to my first website. 
        I am learning web development using my phone.
      </p>

      <button class="btn">Open</button>

    </div>
	
	<!--JavaScript Command Section-->
	 
 <!--open Search bar logic clickListener and id section-->
	<script>
	function openMiddleTopBar(){
	 document.getElementById("middleBar")
	 .classList.toggle("active");
	 }
	
	</script>
	
	
	<!--open menu drawer logic clickListener-->
	<script>
    function openMenuDrawer(){
	  document.getElementById("menuDrawer")
	  .classList.toggle("active");
	 
	  document.getElementById("overlay")
	  .classList.toggle("active");
	  
	  }
	  
	function closeMenuDrawer() {

    document
    .getElementById("menuDrawer")
    .classList.remove("active");

    document
    .getElementById("overlay")
    .classList.remove("active");
	
	}
	
	  
	  </script>

  </body>

</html>
